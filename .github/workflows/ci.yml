name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: debug
          - os: ubuntu-latest
            preset: linux-asan
          - os: windows-latest
            preset: debug

    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: vcpkg

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: "$VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& \"$env:VCPKG_ROOT/bootstrap-vcpkg.bat\" -disableMetrics"

      - name: Select GCC
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - name: Configure, build, and test
        working-directory: source
        run: cmake --workflow --preset ${{ matrix.preset }}

